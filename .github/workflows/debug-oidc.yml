name: Debug OIDC sub only (manual, temporary)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: npm-release  # 元のワークフローと同じ environment を指定
    steps:
      - uses: actions/checkout@v7

      - name: Setup tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Get OIDC id_token and print only sub (NO raw token)
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          # get id_token from runner endpoint
          ID_TOKEN_RESPONSE=$(curl -s -X GET "$ACTIONS_ID_TOKEN_REQUEST_URL" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          # extract token value if JSON, or take raw if not JSON
          TOKEN=$(echo "$ID_TOKEN_RESPONSE" | jq -r '.value // .id_token // .token // .idToken // empty')
          if [ -z "$TOKEN" ]; then
            TOKEN="$ID_TOKEN_RESPONSE"
          fi
          # decode payload without printing the raw token
          PAYLOAD=$(echo "$TOKEN" | cut -d'.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)
          # print ONLY the sub field
          echo "sub: $(echo "$PAYLOAD" | jq -r .sub // "no-sub")"