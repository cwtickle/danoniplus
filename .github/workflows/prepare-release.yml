# .github/workflows/prepare-release.yml
name: R01. Prepare release [manual]

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースバージョン (例: 53.4.0)。「Use workflow from」は develop または support/vXX を選択'
        required: true
      summary:
        description: '更新内容 (PRタイトル / コミットメッセージ)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Detect release type
        id: kind
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MAJOR=${VERSION%%.*}
          if [[ "${GITHUB_REF_NAME}" == support/v* ]]; then
            if [ "${GITHUB_REF_NAME}" != "support/v${MAJOR}" ]; then
              echo "::error::バージョン ${VERSION} は ${GITHUB_REF_NAME} には適用できません"
              exit 1
            fi
            echo "support=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "support=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::実行ブランチは develop または support/vXX を指定してください (現在: ${GITHUB_REF_NAME})"
            exit 1
          fi

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app_token.outputs.token }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Configure git
        run: |
          git config user.name "danoniplus-ci-bot[bot]"
          git config user.email "361131824+danoniplus-ci-bot[bot]@users.noreply.github.com"

      - name: Bump version
        env:
          VERSION: ${{ inputs.version }}
          IS_SUPPORT: ${{ steps.kind.outputs.support }}
        run: |
          if [ "$IS_SUPPORT" = "true" ]; then
            if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
              echo "::error::タグ v${VERSION} は既に存在します"
              exit 1
            fi
            # サポート版は、直前に発行したタグとの差分を Revised 更新の対象にする
            PREV_TAG=$(git describe --tags --abbrev=0)
            node .github/scripts/bump-version.mjs "$VERSION" --base "$PREV_TAG" --no-security
          else
            node .github/scripts/bump-version.mjs "$VERSION" --base origin/master
          fi

      - name: Commit, push and tag (support)
        if: steps.kind.outputs.support == 'true'
        env:
          VERSION: ${{ inputs.version }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "::error::コミット対象の変更がありません"
            exit 1
          fi
          git commit -m "[ver${VERSION}] ${SUMMARY}"
          git tag "v${VERSION}"
          # ブランチとタグを同時に反映 (片方だけ成功する状態を避ける)
          git push --atomic origin "HEAD:refs/heads/${GITHUB_REF_NAME}" "refs/tags/v${VERSION}"

      - name: Commit & push to develop and create PR to master
        if: steps.kind.outputs.support != 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION: ${{ inputs.version }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[ver${VERSION}] ${SUMMARY}"
            git push origin develop
          fi

          node -e '
            const { execSync } = require("node:child_process");
            const fs = require("node:fs");

            // origin/master..HEAD のマージコミットから PR 番号を抽出
            const out = execSync(
              "git log origin/master..HEAD --merges --format=%s%n%b",
              { encoding: "utf8" }
            );
            const nums = [...new Set(
              [...out.matchAll(/Merge pull request #(\d+)/g)].map(m => Number(m[1]))
            )].sort((a, b) => a - b);

            const body = [
              "## :hammer: 変更内容 / Details of Changes",
              "",
              ...(nums.length > 0 ? nums.map(n => `- #${n}`) : [""]),
              ""
            ].join("\n");

            fs.writeFileSync("/tmp/pr_body.md", body, "utf8");
          '

          EXISTING=$(gh pr list --base master --head develop --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "既存のPR #${EXISTING} があるため、タイトルのみ更新します"
            gh pr edit "$EXISTING" \
              --title "[ver${VERSION}] ${SUMMARY}" \
              --body-file /tmp/pr_body.md
          else
            gh pr create \
              --base master \
              --head develop \
              --title "[ver${VERSION}] ${SUMMARY}" \
              --body-file /tmp/pr_body.md \
              --label release
          fi